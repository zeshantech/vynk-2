display_information:
  name: Vynk
  description: Create projects and tasks, log time and see your hours in Vynk.
  background_color: "#6b1e2e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Vynk
    always_online: true
  slash_commands:
    - command: /vynk
      description: Show all Vynk commands
    - command: /log-time
      description: Log time on a task
      usage_hint: "2h #123 what you did [yesterday|YYYY-MM-DD]"
    - command: /week-hours
      description: Your logged hours this week
      usage_hint: "[last]"
    - command: /time-week-logged-times
      description: Your logged hours this week
      usage_hint: "[last]"
    - command: /my-tasks
      description: Your open tasks
    - command: /create-task
      description: Create a task
      usage_hint: "project | task title"
    - command: /projects
      description: List projects
    - command: /create-project
      description: Create a project (admin)
      usage_hint: "Project name"
    - command: /team-hours
      description: Everyone's hours this week (admin)
      usage_hint: "[last]"
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - app_mentions:read
      - im:history
      - channels:history
      - groups:history
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
