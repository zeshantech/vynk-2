name: Vynk Keep A Project

# OpenProject seeds demo projects whenever there are none, and that seeding can crash startup.
# This makes sure at least one project exists, then restarts the app. Run manually.
on:
  workflow_dispatch:

jobs:
  keep-project:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create the Vynk project if there is none, then restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          OPTS="-o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=60"
          sshpass -e ssh $OPTS "$TARGET" 'cd ~/vynk-op && docker compose run --rm --no-deps -T --entrypoint bash openproject -lc "cd /app && RAILS_ENV=production bundle exec rails runner \"Project.exists? || Project.create!(name: %q(Vynk), identifier: %q(vynk), public: false); puts %q(projects: ) + Project.count.to_s\"" 2>&1 | tail -3 && docker compose restart openproject'
      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://vynk.robustcraft.com/health_checks/default || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            sleep 10
          done
          echo "still not healthy (last $code)"; exit 1
