# Production theme proxy: Caddy (TLS) -> this nginx -> OpenProject. Injects the Vynk theme into every HTML page.
server {
  listen 80;
  client_max_body_size 256m;

  # The theme injection asks OpenProject for uncompressed responses, so nginx compresses for the browser.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript text/javascript application/json application/hal+json image/svg+xml application/xml;

  # Slack bot sign-in callback. Resolved at request time so nginx still starts when the bot isn't running.
  location /__slack/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $slack_bot http://slack-bot:3000;
    proxy_pass $slack_bot;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /__vynk/ {
    alias /theme/;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    proxy_pass http://openproject:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/__vynk/theme.css"><script src="/__vynk/theme.js" defer></script></head>';
  }
}
