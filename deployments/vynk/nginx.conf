# Production theme proxy: Caddy (TLS) -> this nginx -> OpenProject. Injects the Vynk theme into every HTML page.
server {
  listen 80;
  client_max_body_size 256m;

  location /__vynk/ {
    alias /theme/;
    add_header Cache-Control "public, max-age=300";
  }

  location / {
    proxy_pass http://openproject:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/__vynk/theme.css"><script src="/__vynk/theme.js" defer></script></head>';
  }
}
