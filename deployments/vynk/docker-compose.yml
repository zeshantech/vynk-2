# Vynk (OpenProject) production stack.
# - openproject: official all-in-one image; external Postgres via DATABASE_URL (Neon)
# - proxy: nginx that injects the Vynk theme (vynk-theme/) and is reached by the server's Caddy on shared_net as "vynk-op"
services:
  openproject:
    image: openproject/openproject:${OP_TAG:-17}
    restart: unless-stopped
    env_file: .env
    volumes:
      - op_assets:/var/openproject/assets

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [openproject]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./vynk-theme:/theme:ro
    networks:
      default:
      shared_net:
        aliases: [vynk-op]

  # Slack bot: started only when SLACK_BOT_TOKEN is in .env (deploy sets COMPOSE_PROFILES=slack).
  slack-bot:
    profiles: [slack]
    build: ./slack-bot
    image: vynk-slack-bot:local
    pull_policy: build
    restart: unless-stopped
    depends_on: [openproject]
    environment:
      OPENPROJECT_URL: ${OPENPROJECT_URL:-https://${OPENPROJECT_HOST__NAME}}
      OPENPROJECT_API_KEY: ${OPENPROJECT_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Asia/Karachi}
      REMINDER_DAY: ${REMINDER_DAY:-}
      REMINDER_TIME: ${REMINDER_TIME:-17:00}
      REMINDER_MIN_HOURS: ${REMINDER_MIN_HOURS:-40}
      OPENPROJECT_OAUTH_CLIENT_ID: ${OPENPROJECT_OAUTH_CLIENT_ID:-}
      OPENPROJECT_OAUTH_CLIENT_SECRET: ${OPENPROJECT_OAUTH_CLIENT_SECRET:-}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-https://${OPENPROJECT_HOST__NAME}}
      EOD_CHANNELS: ${EOD_CHANNELS:-eod-updates,test-vynk}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EOD_MODEL: ${EOD_MODEL:-claude-sonnet-5-5}
    volumes:
      - slack_data:/data

networks:
  shared_net:
    external: true

volumes:
  op_assets:
  slack_data:
