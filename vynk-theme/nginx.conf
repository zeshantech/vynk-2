# Dev preview proxy: injects the Vynk theme stylesheet into every OpenProject HTML page.
server {
  listen 80;
  # Vynk icons in place of OpenProject's (the pages link fingerprinted /assets/ paths).
  location ~ ^/(assets/)?favicon(-[0-9a-f]+)?\.ico$ {
    root /theme;
    try_files /favicon.ico =404;
    add_header Cache-Control "public, max-age=86400";
  }
  location ~ ^/assets/apple-touch-icon.*\.png$ {
    root /theme;
    try_files /apple-touch-icon.png =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location /__vynk/ {
    alias /theme/;
    add_header Cache-Control "no-store";
  }
  location / {
    proxy_pass http://host.docker.internal:8081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/__vynk/favicon.svg"><link rel="stylesheet" href="/__vynk/theme.css"><script src="/__vynk/theme.js" defer></script></head>';
  }
}
